<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>BruceClaw Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;font-size:20px}
.header{background:#181818;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ff6600}
.header h1{color:#ff6600;font-size:22px;font-weight:900;letter-spacing:1px;margin:0}
.header-right{display:flex;gap:10px;align-items:center}
.btn{background:#2a2a2a;color:#ff6600;border:2px solid #ff6600;padding:6px 14px;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-kill{background:#d32f2f;color:#fff;border:2px solid #ff5252}
.status{font-size:14px;font-weight:bold}
.online{color:#00e676}
.offline{color:#ff1744}
.key-drawer{display:none;background:#222;padding:12px;border-bottom:2px solid #ff6600;gap:8px;align-items:center}
.key-drawer input{flex:1;padding:12px;border:2px solid #555;border-radius:15px;background:#111;color:#fff;font-size:18px}
.key-drawer button{padding:12px 18px;background:#ff6600;color:#fff;border:none;border-radius:15px;font-size:18px;font-weight:bold;cursor:pointer}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:90%;padding:14px 18px;border-radius:18px;font-size:20px;line-height:1.5;word-wrap:break-word;font-weight:500}
.user{align-self:flex-end;background:#ff6600;color:#ffffff}
.bot{align-self:flex-start;background:#242424;color:#f1f1f1;border:1px solid #333}
.error{color:#ff5252;font-size:16px;align-self:center;font-weight:bold}
.time{color:#888;font-size:12px;margin-top:4px}
.input-bar{display:flex;gap:10px;padding:12px;background:#181818;border-top:3px solid #ff6600}
.input-bar input{flex:1;padding:14px 18px;border:2px solid #444;border-radius:30px;background:#1f1f1f;color:#fff;font-size:20px;outline:none}
.input-bar button{padding:14px 22px;background:#ff6600;color:#fff;border:none;border-radius:30px;font-size:20px;font-weight:900;cursor:pointer}
.input-bar button:active{background:#e65100}

/* Floating Kill Voice Button */
.float-kill{position:fixed;bottom:90px;right:18px;background:#ff1744;color:#fff;border:3px solid #ffffff;padding:14px 20px;border-radius:30px;font-size:18px;font-weight:900;box-shadow:0 6px 20px rgba(255,23,68,0.6);cursor:pointer;z-index:9999}
.float-kill:active{transform:scale(0.95)}
</style>
</head>
<body>
<div class="header">
<h1>BRUCECLAW</h1>
<div class="header-right">
<button class="btn btn-kill" onclick="killVoice()">🛑 MUTE</button>
<button class="btn" onclick="toggleKey()">🔑 KEY</button>
<div class="status" id="status">Connecting...</div>
</div>
</div>

<div class="key-drawer" id="keyDrawer">
<input id="keyInput" placeholder="Paste Gemini (AIza...) or OpenRouter (sk-or-...) key">
<button onclick="injectKey()">INJECT</button>
</div>

<div class="messages" id="messages"></div>

<button class="float-kill" onclick="killVoice()">🛑 KILL VOICE</button>

<div class="input-bar">
<input id="input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">SEND</button>
</div>

<script>
const BRIDGE='http://localhost:9999';
const msg=document.getElementById('messages');
const stat=document.getElementById('status');

function addMsg(text,cls){
const d=document.createElement('div');
d.className='msg '+cls;
d.textContent=text;
msg.appendChild(d);
msg.scrollTop=msg.scrollHeight;
}

function addTime(){
const d=document.createElement('div');
d.className='time';
d.textContent=new Date().toLocaleTimeString();
msg.appendChild(d);
}

function toggleKey(){
const kd=document.getElementById('keyDrawer');
kd.style.display=(kd.style.display==='flex'?'none':'flex');
}

async function killVoice(){
if('Voice' in window && typeof window.Voice.stop === 'function'){
try{ window.Voice.stop(); }catch(e){}
}
if('speechSynthesis' in window){
try{ window.speechSynthesis.cancel(); }catch(e){}
}
try{
await fetch(BRIDGE+'/kill_voice');
addMsg('🛑 Voice readout killed.','error');
}catch(e){
console.log('Voice kill sent');
}
}

async function injectKey(){
const kInput=document.getElementById('keyInput');
const key=kInput.value.trim();
if(!key)return;
try{
const r=await fetch(BRIDGE+'/key',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({key:key})
});
const d=await r.json();
addMsg(d.message||'Key updated!','bot');
kInput.value='';
toggleKey();
}catch(e){
addMsg('Failed to inject key: '+e.message,'error');
}
}

async function send(){
const input=document.getElementById('input');
const text=input.value.trim();
if(!text)return;
input.value='';
addMsg(text,'user');
addTime();

try{
const r=await fetch(BRIDGE,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text}),
signal:AbortSignal.timeout(30000)
});
const d=await r.json();
const reply=d.reply||d.error||'No response';
addMsg(reply,'bot');
addTime();
}catch(e){
addMsg('Error: '+e.message,'error');
}
}

async function checkBridge(){
try{
const r=await fetch(BRIDGE+'/',{signal:AbortSignal.timeout(3000)});
const d=await r.json();
stat.textContent='Connected ('+d.tools.length+' tools)';
stat.className='status online';
}catch(e){
stat.textContent='Bridge offline';
stat.className='status offline';
}
}

checkBridge();
setInterval(checkBridge,15000);
addMsg('BruceClaw ready.','bot');
</script>
</body>
</html>
